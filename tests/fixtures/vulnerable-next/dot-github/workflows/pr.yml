name: pr
on:
  pull_request_target:
    types: [opened, synchronize]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: tj-actions/changed-files@v44
      - name: greet
        run: |
          echo "Title: ${{ github.event.pull_request.title }}"
          npm install
      - run: npm run build
