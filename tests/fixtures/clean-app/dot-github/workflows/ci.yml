name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # fixture: a full-length commit SHA
      - name: greet
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Title: $TITLE"
      - run: npm ci --ignore-scripts
